<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>360° 全景瀏覽</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    #panorama {
      width: 100vw;
      height: 100vh;
    }

    .title {
      position: fixed;
      z-index: 10;
      left: 18px;
      top: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,.55);
      color: white;
      font-size: 16px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="title">360° 全景瀏覽</div>
  <div id="panorama"></div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <script>
    pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: '360.png',

      autoLoad: true,
      showControls: true,
      compass: false,

      // 初始觀看方向，可自行修改
      yaw: 0,
      pitch: 0,
      hfov: 100,

      // 滑鼠滾輪縮放
      mouseZoom: true,

      // 手機陀螺儀按鈕
      orientationOnByDefault: false
    });
  </script>
</body>
</html>
