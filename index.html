<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360° 全景瀏覽</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

<style>
html,body,#panorama{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
</style>
</head>

<body>

<div id="panorama"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
const p = new URLSearchParams(location.search);

// 網址有 ?img=xxx.png 就讀取指定圖片
// 沒有指定時，仍然使用原本的 360.png
const image = p.get('img') || '360.png';

pannellum.viewer('panorama', {
  type: 'equirectangular',
  panorama: image,
  autoLoad: true,
  showControls: true,
  yaw: 0,
  pitch: 0,
  hfov: 100
});
</script>

</body>
</html>
